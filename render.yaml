services:
  - type: web
    name: bubble-api-mvp
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUBBLE_POLL_MS
        value: "200"
      - key: BUBBLE_PLAYER_TTL_MS
        value: "2500"
      - key: BUBBLE_SESSION_TTL_MS
        value: "60000"
      - key: BUBBLE_HEARTBEAT_MS
        value: "10000"
      - key: BUBBLE_TOKEN_TTL_MS
        value: "1800000"
      - key: BUBBLE_AOI_RADIUS_BU
        value: "96"
      - key: BUBBLE_MAX_REMOTES
        value: "64"
      - key: BUBBLE_SYNC_RATE_PER_SEC
        value: "15"
      - key: BUBBLE_REGISTER_RATE_PER_MIN
        value: "30"
      - key: BUBBLE_SERVER_KEYS
        sync: false
      - key: BUBBLE_ADMIN_KEY
        sync: false
