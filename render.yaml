services:
  - type: web
    name: bubble-api-mvp
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: BUBBLE_BETA_ROOM
        value: bubble-N001z
      - key: BUBBLE_BETA_TTL_MS
        value: "3000"
      - key: BUBBLE_BETA_MAX_PLAYERS
        value: "64"
      - key: BUBBLE_BETA_MAX_ROOMS
        value: "8"
      - key: BUBBLE_BETA_RATE_PER_SEC
        value: "30"
